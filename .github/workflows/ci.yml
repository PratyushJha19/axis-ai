name: AXIS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: axis_ci
          POSTGRES_DB: axis_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axis_ci -d axis_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Use matching PostgreSQL 18 backup clients
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/axis-pg-bin"
          for tool in pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/axis-pg-bin/$tool" <<EOF
          #!/bin/sh
          exec docker exec -i -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE ${{ job.services.postgres.id }} $tool "\$@"
          EOF
            chmod 700 "$RUNNER_TEMP/axis-pg-bin/$tool"
          done
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://axis_ci@127.0.0.1:5432/axis_test_ci
          PG_BIN: ${{ runner.temp }}/axis-pg-bin
      - run: npm audit --audit-level=high
